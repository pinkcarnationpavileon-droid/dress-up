<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dress-Up Studio</title>
  <link rel="stylesheet" href="style-4.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Gamja Flower', cursive, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      height: 100vh;
      overflow: hidden;
      /* Main background requested */
      background-image: url('https://nicegirlslumber.neocities.org/dressupintime.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Layout Wrapper */
    .game-container {
      display: flex;
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* Left Panel: Color Customization Controls */
    .controls-panel {
      width: 280px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(5px);
      box-shadow: 2px 0 10px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      gap: 15px;
      z-index: 2;
      margin: 20px;
      border-radius: 16px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    /* Main Stage */
    .avatar-stage {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .avatar-container {
      position: relative;
      width: 350px;
      height: 550px;
    }

    /* Canvas Elements Layering (PNG Overlays) */
    .avatar-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }

    /* --- PNG Layer Asset Paths --- */
    /* Insert PNG image URLs inside the url() fields below */
    #bodyBase { background-image: url('YOUR_BASE_BODY.png'); }
    #eyesLayer { background-image: url('YOUR_EYES.png'); }
    #hairBack { background-image: url('YOUR_HAIR_BACK_DEFAULT.png'); }
    #hairFront { background-image: url('YOUR_HAIR_FRONT_DEFAULT.png'); }

    /* Right Action Bar (PNG Controls & Curtain Pull) */
    .nav-buttons {
      position: absolute;
      right: 30px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      z-index: 5;
    }

    /* PNG Arrow Buttons */
    .png-arrow-btn {
      width: 60px;
      height: 60px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      transition: transform 0.2s ease;
    }

    .png-arrow-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .png-arrow-btn:hover {
      transform: scale(1.15);
    }

    /* Curtain Pull Handle */
    .curtain-pull {
      width: 45px;
      height: 90px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .curtain-pull img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .curtain-pull:hover {
      transform: translateY(5px);
    }

    /* Curtain Drawer Panel */
    .curtain-drawer {
      position: fixed;
      right: -360px; /* Hidden off-screen by default */
      top: 0;
      width: 340px;
      height: 100%;
      /* Curtain styling with shadow to give depth */
      background: #ffb7b2; 
      box-shadow: -10px 0 20px rgba(0,0,0,0.3);
      transition: right 0.5s cubic-bezier(0.77, 0, 0.175, 1); /* Soft curtain slide */
      padding: 25px;
      box-sizing: border-box;
      z-index: 10;
      border-left: 6px solid #e57373;
    }

    .curtain-drawer.open {
      right: 0; /* Slides into view */
    }

    .close-btn {
      float: right;
      cursor: pointer;
      font-weight: bold;
      font-size: 1.5rem;
    }

    .item-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-top: 25px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .item-card {
      background: rgba(255, 255, 255, 0.7);
      border: 2px solid #ff8b94;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s;
    }

    .item-card:hover {
      background: #ffffff;
    }

    .item-card img {
      width: 80px;
      height: 80px;
      object-fit: contain;
    }
  </style>
</head>

<body>

  <div class="game-container">
    
    <div class="controls-panel">
      <h2>Customization</h2>
      
      <div class="control-group">
        <label for="skinColor">Skin Tone Tint:</label>
        <input type="color" id="skinColor" value="#ffffff" onchange="updateSkinColor(this.value)">
      </div>

      <div class="control-group">
        <label for="eyeColor">Eye Tint:</label>
        <input type="color" id="eyeColor" value="#ffffff" onchange="updateEyeColor(this.value)">
      </div>

      <div class="control-group">
        <label for="hairColor">Hair Color Tint:</label>
        <input type="color" id="hairColor" value="#ffffff" onchange="updateHairColor(this.value)">
      </div>

      <div class="control-group" style="align-items: center; margin-top: 15px;">
        <label>Next Hairstyle:</label>
        <button class="png-arrow-btn" onclick="cycleHairstyle()" title="Next Hairstyle">
          <img src="YOUR_RIGHT_ARROW.png" alt="Next Hair Arrow">
        </button>
      </div>
    </div>

    <div class="avatar-stage">
      <div class="avatar-container">
        <div id="hairBack" class="avatar-layer"></div>
        <div id="bodyBase" class="avatar-layer"></div>
        <div id="eyesLayer" class="avatar-layer"></div>
        <div id="clothingLayer" class="avatar-layer"></div>
        <div id="shoesLayer" class="avatar-layer"></div>
        <div id="hairFront" class="avatar-layer"></div>
      </div>

      <div class="nav-buttons">
        
        <div class="curtain-pull" onclick="toggleDrawer('closet')" title="Pull Closet Curtain">
          <img src="YOUR_CURTAIN_PULL_HANDLE.png" alt="Pull Curtain">
        </div>

        <button class="png-arrow-btn" onclick="toggleDrawer('shoes')" title="Open Shoe Rack">
          <img src="YOUR_SHOE_ICON_ARROW.png" alt="Shoes">
        </button>

      </div>
    </div>

    <div id="wardrobeDrawer" class="curtain-drawer">
      <span class="close-btn" onclick="closeDrawer()">✕</span>
      <h2 id="drawerTitle">Closet</h2>
      
      <div id="drawerContent" class="item-grid">
        </div>
    </div>

  </div>

  <script>
    // State Tracking
    const state = {
      hairstyleIndex: 0
    };

    // Replace these arrays with paths to your actual PNG assets!
    const hairstyles = [
      { front: 'YOUR_HAIR_FRONT_1.png', back: 'YOUR_HAIR_BACK_1.png' },
      { front: 'YOUR_HAIR_FRONT_2.png', back: 'YOUR_HAIR_BACK_2.png' },
      { front: 'YOUR_HAIR_FRONT_3.png', back: 'YOUR_HAIR_BACK_3.png' }
    ];

    const topsList = [
      { name: 'Pink Blouse', icon: 'YOUR_BLOUSE1_ICON.png', fullPng: 'YOUR_BLOUSE1_LAYER.png' },
      { name: 'Blue Shirt', icon: 'YOUR_SHIRT1_ICON.png', fullPng: 'YOUR_SHIRT1_LAYER.png' }
    ];

    const shoesList = [
      { name: 'Sneakers', icon: 'YOUR_SNEAKERS_ICON.png', fullPng: 'YOUR_SNEAKERS_LAYER.png' },
      { name: 'Heels', icon: 'YOUR_HEELS_ICON.png', fullPng: 'YOUR_HEELS_LAYER.png' }
    ];

    // Color Pickers Adjustments
    function updateSkinColor(color) {
      document.getElementById('bodyBase').style.filter = `drop-shadow(0 0 0 ${color})`;
    }

    function updateEyeColor(color) {
      document.getElementById('eyesLayer').style.filter = `drop-shadow(0 0 0 ${color})`;
    }

    function updateHairColor(color) {
      document.getElementById('hairFront').style.filter = `drop-shadow(0 0 0 ${color})`;
      document.getElementById('hairBack').style.filter = `drop-shadow(0 0 0 ${color})`;
    }

    // Hairstyle Switcher using PNG Arrow
    function cycleHairstyle() {
      state.hairstyleIndex = (state.hairstyleIndex + 1) % hairstyles.length;
      const currentHair = hairstyles[state.hairstyleIndex];
      
      document.getElementById('hairFront').style.backgroundImage = `url('${currentHair.front}')`;
      document.getElementById('hairBack').style.backgroundImage = `url('${currentHair.back}')`;
    }

    // Drawer Visibility Management
    function toggleDrawer(type) {
      const drawer = document.getElementById('wardrobeDrawer');
      const title = document.getElementById('drawerTitle');

      if (type === 'closet') {
        title.innerText = "Shirts & Blouses";
        populateItems(topsList, 'top');
      } else if (type === 'shoes') {
        title.innerText = "Shoes Collection";
        populateItems(shoesList, 'shoes');
      }

      drawer.classList.add('open');
    }

    function closeDrawer() {
      document.getElementById('wardrobeDrawer').classList.remove('open');
    }

    // Populate Curtain Drawer Grid
    function populateItems(itemList, category) {
      const content = document.getElementById('drawerContent');
      content.innerHTML = ''; // Clear previous items

      itemList.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'item-card';
        card.innerHTML = `<img src="${item.icon}" alt="${item.name}"><p>${item.name}</p>`;
        card.onclick = () => applyClothingItem(category, item.fullPng);
        content.appendChild(card);
      });
    }

    // Apply PNG Item to Character Stage
    function applyClothingItem(category, pngPath) {
      if (category === 'top') {
        document.getElementById('clothingLayer').style.backgroundImage = `url('${pngPath}')`;
      } else if (category === 'shoes') {
        document.getElementById('shoesLayer').style.backgroundImage = `url('${pngPath}')`;
      }
    }
  </script>
</body>
</html>
