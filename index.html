<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dress-Up Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: 'Gamja Flower', cursive, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background-image: url('https://nicegirlslumber.neocities.org/dressupintime.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      user-select: none;
    }

    .game-container {
      display: flex;
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* =========================================================
       POP-UP MODAL: BODY TYPE SELECTION
       ========================================================= */
    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      transition: opacity 0.3s ease;
    }

    .popup-overlay.hidden {
      display: none;
    }

    .popup-card {
      background: #fff0f5;
      border: 4px solid #f48fb1;
      border-radius: 20px;
      padding: 25px 30px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      width: 90%;
    }

    .popup-card h2 {
      margin: 0 0 10px 0;
      color: #880e4f;
      font-size: 2.2rem;
    }

    .popup-card p {
      color: #5c002e;
      font-size: 1.3rem;
      margin-bottom: 20px;
    }

    .body-options-grid {
      display: flex;
      justify-content: space-around;
      gap: 15px;
    }

    .body-card-option {
      flex: 1;
      background: white;
      border: 3px solid #f48fb1;
      border-radius: 15px;
      padding: 10px;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }

    .body-card-option:hover {
      transform: scale(1.08);
      border-color: #f06292;
    }

    .body-card-option img {
      width: 100%;
      height: 140px;
      object-fit: contain;
    }

    .body-card-option span {
      display: block;
      margin-top: 8px;
      font-size: 1.4rem;
      color: #880e4f;
      font-weight: bold;
    }

    /* =========================================================
       CUSTOMIZATION BOX (LEFT CURTAIN)
       ========================================================= */
    .customization-curtain-container {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      z-index: 10;
      display: flex;
      align-items: center;
      pointer-events: none;
    }

    .customization-box {
      width: 290px;
      height: 92%;
      margin-left: 20px;
      padding: 20px;
      background: rgba(255, 245, 247, 0.92);
      backdrop-filter: blur(8px);
      box-shadow: 10px 0 25px rgba(0,0,0,0.25);
      border-radius: 20px;
      border: 3px solid #f48fb1;
      display: flex;
      flex-direction: column;
      gap: 15px;
      pointer-events: auto;
      transform: translateX(-330px);
      transition: transform 0.6s cubic-bezier(0.77, 0, 0.175, 1);
      position: relative;
    }

    .customization-box.open { transform: translateX(0); }

    .custom-pull-tab {
      position: absolute;
      right: -55px;
      top: 30%;
      width: 55px;
      height: 110px;
      background: #f06292;
      border-radius: 0 16px 16px 0;
      box-shadow: 5px 3px 12px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      pointer-events: auto;
      color: white;
      font-size: 1.1rem;
      text-align: center;
      padding: 5px;
    }

    .body-type-controls {
      display: flex;
      gap: 5px;
      justify-content: space-between;
    }

    .body-btn {
      flex: 1;
      padding: 8px;
      background: #fff;
      border: 2px solid #f48fb1;
      border-radius: 8px;
      font-family: inherit;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .body-btn.active {
      background: #f06292;
      color: white;
      border-color: #f06292;
    }

    /* =========================================================
       MAIN AVATAR STAGE
       ========================================================= */
    .avatar-stage {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* INCREASED SIZE: Up 30px from 360x580 to 390x610 */
    .avatar-container {
      position: relative;
      width: 390px;
      height: 610px;
    }

    .avatar-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      pointer-events: none;
    }

    /* WORKING SKIN SLIDER (Mask Overlay Technique) */
    #bodyBase {
      -webkit-mask-image: url('https://nicegirlslumber.neocities.org/bodyA.png');
      mask-image: url('https://nicegirlslumber.neocities.org/bodyA.png');
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
      background-color: #ffffff; /* Default Skin Tint Color */
    }

    /* RIGHT SIDE ACTION BUTTONS */
    .nav-buttons {
      position: absolute;
      right: 30px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      z-index: 5;
    }

    .png-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #880e4f;
      font-size: 1.1rem;
      font-weight: bold;
    }

    /* =========================================================
       FULL CLOSET OVERLAY (tempcloset.png)
       ========================================================= */
    .full-closet-curtain {
      position: absolute;
      top: 0;
      right: -100vw;
      width: 100vw;
      height: 100vh;
      background-image: url('https://nicegirlslumber.neocities.org/tempcloset.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      box-shadow: -15px 0 35px rgba(0,0,0,0.5);
      transition: right 0.7s cubic-bezier(0.77, 0, 0.175, 1);
      z-index: 20;
      display: flex;
      flex-direction: column;
      padding: 30px;
      box-sizing: border-box;
    }

    .full-closet-curtain.open { right: 0; }

    .closet-close-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      background: #f06292;
      color: white;
      border: 2px solid white;
      padding: 10px 22px;
      border-radius: 25px;
      font-family: inherit;
      font-size: 1.3rem;
      cursor: pointer;
      box-shadow: 2px 4px 10px rgba(0,0,0,0.3);
      z-index: 25;
      transition: transform 0.2s, background 0.2s;
    }

    .closet-close-btn:hover {
      background: #ec407a;
      transform: scale(1.05);
    }

    .closet-workspace {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-top: 50px;
    }

    /* 4 Rows of 3 Folded Pants */
    .shelves-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 60%;
      margin: 0 auto;
    }

    .pants-row {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(4px);
      padding: 8px;
      border-radius: 12px;
      border-bottom: 3px solid rgba(0,0,0,0.15);
    }

    .pants-item {
      width: 75px;
      height: 65px;
      cursor: pointer;
      transition: transform 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pants-item img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }

    .pants-item:hover {
      transform: scale(1.2) translateY(-4px);
    }

    /* Clothes Rack with 11 Hanging Shirts */
    .rack-container {
      width: 90%;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(4px);
      padding: 15px 20px;
      border-radius: 16px;
      border-top: 4px solid #8d6e63;
      display: flex;
      justify-content: space-between;
      align-items: center;
      overflow-x: auto;
    }

    .shirt-item {
      width: 70px;
      height: 110px;
      cursor: pointer;
      transition: transform 0.2s;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .shirt-item img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.25));
    }

    .shirt-item:hover {
      transform: scale(1.18) translateY(-6px);
    }
  </style>
</head>

<body>

  <div id="bodyPopup" class="popup-overlay">
    <div class="popup-card">
      <h2>Welcome to Dress-Up Studio!</h2>
      <p>Which body type suits you best?</p>
      
      <div class="body-options-grid">
        <div class="body-card-option" onclick="selectInitialBody('a')">
          <img src="https://nicegirlslumber.neocities.org/bodyA.png" alt="Body A">
          <span>Body A</span>
        </div>
        <div class="body-card-option" onclick="selectInitialBody('b')">
          <img src="https://nicegirlslumber.neocities.org/bodyB.png" alt="Body B">
          <span>Body B</span>
        </div>
        <div class="body-card-option" onclick="selectInitialBody('c')">
          <img src="https://nicegirlslumber.neocities.org/bodyC.png" alt="Body C">
          <span>Body C</span>
        </div>
      </div>
    </div>
  </div>

  <div class="game-container">
    
    <div class="customization-curtain-container">
      <div id="customBox" class="customization-box">
        
        <div class="custom-pull-tab" onclick="toggleCustomBox()">
          <span>PULL</span>
        </div>

        <h2 style="margin: 0; color: #880e4f; text-align: center;">Avatar Styling</h2>
        
        <div>
          <label style="color: #880e4f; font-weight: bold;">Body Type:</label>
          <div class="body-type-controls" style="margin-top: 5px;">
            <button class="body-btn active" onclick="setBodyType('a')" id="btnBodyA">A</button>
            <button class="body-btn" onclick="setBodyType('b')" id="btnBodyB">B</button>
            <button class="body-btn" onclick="setBodyType('c')" id="btnBodyC">C</button>
          </div>
        </div>

        <div>
          <label style="color: #880e4f; font-weight: bold;">Skin Tint:</label>
          <input type="color" id="skinColor" value="#ffffff" oninput="updateSkinColor(this.value)" style="width:100%; height:35px; cursor:pointer;">
        </div>

      </div>
    </div>

    <div class="avatar-stage">
      <div class="avatar-container">
        <div id="bodyBase" class="avatar-layer"></div>
        <div id="pantsLayer" class="avatar-layer"></div>
        <div id="shirtLayer" class="avatar-layer"></div>
        <div id="shoesLayer" class="avatar-layer"></div>
      </div>

      <div class="nav-buttons">
        <button class="png-btn" onclick="openFullCloset()">
          <span>Closet ➔</span>
        </button>
      </div>
    </div>

    <div id="fullCloset" class="full-closet-curtain">
      <button class="closet-close-btn" onclick="closeFullCloset()">➔ Back to Avatar</button>
      
      <div class="closet-workspace">
        
        <div class="shelves-container">
          
          <div class="pants-row">
            <div class="pants-item" onclick="equipPants('YOUR_PANTS_1.png')"><img src="YOUR_PANTS_FOLDED_1.png" alt="Pants 1"></div>
            <div class="pants-item" onclick="equipPants('YOUR_PANTS_2.png')"><img src="YOUR_PANTS_FOLDED_2.png" alt="Pants 2"></div>
            <div class="pants-item" onclick="equipPants('YOUR_PANTS_3.png')"><img src="YOUR_PANTS_FOLDED_3.png" alt="Pants 3"></div>
          </div>
          
          <div class="pants-row">
            <div class="pants-item" onclick="equipPants('YOUR_PANTS_4.png')"><img src="YOUR_PANTS_FOLDED_4.png" alt="Pants 4"></div>
            <div class="pants-item" onclick="equipPants('YOUR_PANTS_5.png')"><img src="YOUR_PANTS_FOLDED_5.png" alt="Pants 5"></div>
            <div class="pants-item" onclick="equipPants('YOUR_PANTS_6.png')"><img src="YOUR_PANTS_FOLDED_6.png" alt="Pants 6"></div>
          </div>

          <div class="pants-row">
            <div class="pants-item" onclick="equipPants('YOUR_PANTS_7.png')"><img src="YOUR_PANTS_FOLDED_7.png" alt="Pants 7"></div>
            <div class="pants-item" onclick="equipPants('YOUR_PANTS_8.png')"><img src="YOUR_PANTS_FOLDED_8.png" alt="Pants 8"></div>
            <div class="pants-item" onclick="equipPants('YOUR_PANTS_9.png')"><img src="YOUR_PANTS_FOLDED_9.png" alt="Pants 9"></div>
          </div>

          <div class="pants-row">
            <div class="pants-item" onclick="equipPants('YOUR_PANTS_10.png')"><img src="YOUR_PANTS_FOLDED_10.png" alt="Pants 10"></div>
            <div class="pants-item" onclick="equipPants('YOUR_PANTS_11.png')"><img src="YOUR_PANTS_FOLDED_11.png" alt="Pants 11"></div>
            <div class="pants-item" onclick="equipPants('YOUR_PANTS_12.png')"><img src="YOUR_PANTS_FOLDED_12.png" alt="Pants 12"></div>
          </div>

        </div>

        <div class="rack-container">
          <div class="shirt-item" onclick="equipShirt('YOUR_SHIRT_1.png')"><img src="YOUR_SHIRT_HANGING_1.png" alt="Shirt 1"></div>
          <div class="shirt-item" onclick="equipShirt('YOUR_SHIRT_2.png')"><img src="YOUR_SHIRT_HANGING_2.png" alt="Shirt 2"></div>
          <div class="shirt-item" onclick="equipShirt('YOUR_SHIRT_3.png')"><img src="YOUR_SHIRT_HANGING_3.png" alt="Shirt 3"></div>
          <div class="shirt-item" onclick="equipShirt('YOUR_SHIRT_4.png')"><img src="YOUR_SHIRT_HANGING_4.png" alt="Shirt 4"></div>
          <div class="shirt-item" onclick="equipShirt('YOUR_SHIRT_5.png')"><img src="YOUR_SHIRT_HANGING_5.png" alt="Shirt 5"></div>
          <div class="shirt-item" onclick="equipShirt('YOUR_SHIRT_6.png')"><img src="YOUR_SHIRT_HANGING_6.png" alt="Shirt 6"></div>
          <div class="shirt-item" onclick="equipShirt('YOUR_SHIRT_7.png')"><img src="YOUR_SHIRT_HANGING_7.png" alt="Shirt 7"></div>
          <div class="shirt-item" onclick="equipShirt('YOUR_SHIRT_8.png')"><img src="YOUR_SHIRT_HANGING_8.png" alt="Shirt 8"></div>
          <div class="shirt-item" onclick="equipShirt('YOUR_SHIRT_9.png')"><img src="YOUR_SHIRT_HANGING_9.png" alt="Shirt 9"></div>
          <div class="shirt-item" onclick="equipShirt('YOUR_SHIRT_10.png')"><img src="YOUR_SHIRT_HANGING_10.png" alt="Shirt 10"></div>
          <div class="shirt-item" onclick="equipShirt('YOUR_SHIRT_11.png')"><img src="YOUR_SHIRT_HANGING_11.png" alt="Shirt 11"></div>
        </div>

      </div>
    </div>

  </div>

  <script>
    // Direct Links to Neocities Body PNG Assets
    const bodyImages = {
      a: 'https://nicegirlslumber.neocities.org/bodyA.png',
      b: 'https://nicegirlslumber.neocities.org/bodyB.png',
      c: 'https://nicegirlslumber.neocities.org/bodyC.png'
    };

    const gameState = {
      activeBodyType: 'a'
    };

    // Pop-Up Selection Logic
    function selectInitialBody(type) {
      setBodyType(type);
      document.getElementById('bodyPopup').classList.add('hidden');
    }

    // Set Body Type & Update Mask Image
    function setBodyType(type) {
      if (!bodyImages[type]) return;

      gameState.activeBodyType = type;

      // Update base avatar mask image so skin tint color fills it
      const bodyEl = document.getElementById('bodyBase');
      bodyEl.style.webkitMaskImage = `url('${bodyImages[type]}')`;
      bodyEl.style.maskImage = `url('${bodyImages[type]}')`;

      // Update sidebar button highlights
      document.getElementById('btnBodyA').classList.remove('active');
      document.getElementById('btnBodyB').classList.remove('active');
      document.getElementById('btnBodyC').classList.remove('active');
      document.getElementById(`btnBody${type.toUpperCase()}`).classList.add('active');
    }

    function toggleCustomBox() {
      document.getElementById('customBox').classList.toggle('open');
    }

    function openFullCloset() {
      document.getElementById('fullCloset').classList.add('open');
    }

    function closeFullCloset() {
      document.getElementById('fullCloset').classList.remove('open');
    }

    // Working Skin Tint Color Picker Logic
    function updateSkinColor(color) {
      document.getElementById('bodyBase').style.backgroundColor = color;
    }

    // Clothing Equip Logic
    function equipPants(pantsPngUrl) {
      document.getElementById('pantsLayer').style.backgroundImage = `url('${pantsPngUrl}')`;
    }

    function equipShirt(shirtPngUrl) {
      document.getElementById('shirtLayer').style.backgroundImage = `url('${shirtPngUrl}')`;
    }
  </script>
</body>
</html>
