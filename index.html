<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dress-Up Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: 'Gamja Flower', cursive, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background-image: url('https://nicegirlslumber.neocities.org/dressupintime.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      user-select: none;
    }

    .game-container {
      display: flex;
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* =========================================================
       POP-UP MODAL: BODY TYPE SELECTION
       ========================================================= */
    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100; /* Stays on top of everything */
      transition: opacity 0.3s ease;
    }

    .popup-overlay.hidden {
      display: none;
    }

    .popup-card {
      background: #fff0f5;
      border: 4px solid #f48fb1;
      border-radius: 20px;
      padding: 25px 30px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      width: 90%;
    }

    .popup-card h2 {
      margin: 0 0 10px 0;
      color: #880e4f;
      font-size: 2.2rem;
    }

    .popup-card p {
      color: #5c002e;
      font-size: 1.3rem;
      margin-bottom: 20px;
    }

    .body-options-grid {
      display: flex;
      justify-content: space-around;
      gap: 15px;
    }

    .body-card-option {
      flex: 1;
      background: white;
      border: 3px solid #f48fb1;
      border-radius: 15px;
      padding: 10px;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }

    .body-card-option:hover {
      transform: scale(1.08);
      border-color: #f06292;
    }

    .body-card-option img {
      width: 100%;
      height: 140px;
      object-fit: contain;
    }

    .body-card-option span {
      display: block;
      margin-top: 8px;
      font-size: 1.4rem;
      color: #880e4f;
      font-weight: bold;
    }

    /* =========================================================
       CUSTOMIZATION BOX (LEFT CURTAIN)
       ========================================================= */
    .customization-curtain-container {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      z-index: 10;
      display: flex;
      align-items: center;
      pointer-events: none;
    }

    .customization-box {
      width: 290px;
      height: 92%;
      margin-left: 20px;
      padding: 20px;
      background: rgba(255, 245, 247, 0.92);
      backdrop-filter: blur(8px);
      box-shadow: 10px 0 25px rgba(0,0,0,0.25);
      border-radius: 20px;
      border: 3px solid #f48fb1;
      display: flex;
      flex-direction: column;
      gap: 15px;
      pointer-events: auto;
      transform: translateX(-330px);
      transition: transform 0.6s cubic-bezier(0.77, 0, 0.175, 1);
      position: relative;
    }

    .customization-box.open { transform: translateX(0); }

    .custom-pull-tab {
      position: absolute;
      right: -55px;
      top: 30%;
      width: 55px;
      height: 110px;
      background: #f06292;
      border-radius: 0 16px 16px 0;
      box-shadow: 5px 3px 12px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      pointer-events: auto;
      color: white;
      font-size: 1.1rem;
      text-align: center;
      padding: 5px;
    }

    .body-type-controls {
      display: flex;
      gap: 5px;
      justify-content: space-between;
    }

    .body-btn {
      flex: 1;
      padding: 8px;
      background: #fff;
      border: 2px solid #f48fb1;
      border-radius: 8px;
      font-family: inherit;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .body-btn.active {
      background: #f06292;
      color: white;
      border-color: #f06292;
    }

    /* =========================================================
       MAIN AVATAR STAGE
       ========================================================= */
    .avatar-stage {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .avatar-container {
      position: relative;
      width: 360px;
      height: 580px;
    }

    .avatar-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      pointer-events: none;
    }

    /* Body Base default loaded dynamically */
    #bodyBase {
      background-image: url('https://nicegirlslumber.neocities.org/bodyA.png');
    }

    /* RIGHT SIDE ACTION BUTTONS */
    .nav-buttons {
      position: absolute;
      right: 30px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      z-index: 5;
    }

    .png-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #880e4f;
      font-size: 1.1rem;
      font-weight: bold;
    }

    /* FULL CLOSET OVERLAY */
    .full-closet-curtain {
      position: absolute;
      top: 0;
      right: -100vw;
      width: 100vw;
      height: 100vh;
      background-image: url('https://nicegirlslumber.neocities.org/tempcloset.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      box-shadow: -15px 0 35px rgba(0,0,0,0.5);
      transition: right 0.7s cubic-bezier(0.77, 0, 0.175, 1);
      z-index: 20;
    }

    .full-closet-curtain.open { right: 0; }
  </style>
</head>

<body>

  <div id="bodyPopup" class="popup-overlay">
    <div class="popup-card">
      <h2>Welcome to Dress-Up Studio!</h2>
      <p>Which body type suits you best?</p>
      
      <div class="body-options-grid">
        <div class="body-card-option" onclick="selectInitialBody('a')">
          <img src="https://nicegirlslumber.neocities.org/bodyA.png" alt="Body A">
          <span>Body A</span>
        </div>
        <div class="body-card-option" onclick="selectInitialBody('b')">
          <img src="https://nicegirlslumber.neocities.org/bodyB.png" alt="Body B">
          <span>Body B</span>
        </div>
        <div class="body-card-option" onclick="selectInitialBody('c')">
          <img src="https://nicegirlslumber.neocities.org/bodyC.png" alt="Body C">
          <span>Body C</span>
        </div>
      </div>
    </div>
  </div>

  <div class="game-container">
    
    <div class="customization-curtain-container">
      <div id="customBox" class="customization-box">
        
        <div class="custom-pull-tab" onclick="toggleCustomBox()">
          <span>PULL</span>
        </div>

        <h2 style="margin: 0; color: #880e4f; text-align: center;">Avatar Styling</h2>
        
        <div>
          <label style="color: #880e4f; font-weight: bold;">Body Type:</label>
          <div class="body-type-controls" style="margin-top: 5px;">
            <button class="body-btn active" onclick="setBodyType('a')" id="btnBodyA">A</button>
            <button class="body-btn" onclick="setBodyType('b')" id="btnBodyB">B</button>
            <button class="body-btn" onclick="setBodyType('c')" id="btnBodyC">C</button>
          </div>
        </div>

        <div>
          <label style="color: #880e4f; font-weight: bold;">Skin Tint:</label>
          <input type="color" id="skinColor" value="#ffffff" onchange="updateSkinColor(this.value)" style="width:100%; height:35px;">
        </div>

      </div>
    </div>

    <div class="avatar-stage">
      <div class="avatar-container">
        <div id="bodyBase" class="avatar-layer"></div>
        <div id="pantsLayer" class="avatar-layer"></div>
        <div id="shirtLayer" class="avatar-layer"></div>
        <div id="shoesLayer" class="avatar-layer"></div>
      </div>

      <div class="nav-buttons">
        <button class="png-btn" onclick="openFullCloset()">
          <span>Closet ➔</span>
        </button>
      </div>
    </div>

    <div id="fullCloset" class="full-closet-curtain">
      <button style="margin:20px; padding:10px 20px; font-size:1.2rem;" onclick="closeFullCloset()">➔ Back</button>
    </div>

  </div>

  <script>
    // Direct Links to Your Neocities Body Assets
    const bodyImages = {
      a: 'https://nicegirlslumber.neocities.org/bodyA.png',
      b: 'https://nicegirlslumber.neocities.org/bodyB.png',
      c: 'https://nicegirlslumber.neocities.org/bodyC.png'
    };

    const gameState = {
      activeBodyType: 'a'
    };

    // Pop-Up Selection Logic
    function selectInitialBody(type) {
      setBodyType(type);
      // Hide the pop-up
      document.getElementById('bodyPopup').classList.add('hidden');
    }

    // Set Body Type & Update Base Image
    function setBodyType(type) {
      if (!bodyImages[type]) return;

      gameState.activeBodyType = type;

      // Update base avatar image
      document.getElementById('bodyBase').style.backgroundImage = `url('${bodyImages[type]}')`;

      // Update sidebar button highlights
      document.getElementById('btnBodyA').classList.remove('active');
      document.getElementById('btnBodyB').classList.remove('active');
      document.getElementById('btnBodyC').classList.remove('active');
      document.getElementById(`btnBody${type.toUpperCase()}`).classList.add('active');
    }

    function toggleCustomBox() {
      document.getElementById('customBox').classList.toggle('open');
    }

    function openFullCloset() {
      document.getElementById('fullCloset').classList.add('open');
    }

    function closeFullCloset() {
      document.getElementById('fullCloset').classList.remove('open');
    }

    function updateSkinColor(color) {
      document.getElementById('bodyBase').style.filter = `drop-shadow(0 0 0 ${color})`;
    }
  </script>
</body>
</html>
